name: Update alpha.6 release details

on:
  push:
    paths:
      - .github/workflows/update-alpha6-release-details.yml

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'GlazeChou/haven-note'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update release title and notes only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/alpha6-notes.md <<'NOTES'
          Haven Note 0.1.1-alpha.6 预发布测试版。

          ### 主要更新

          - **局域网同步**：按数据和文档范围控制自动同步；改进仓库文件、任务、账本和密钥箱的同步稳定性。自动同步选项默认关闭，可在设置中按需开启。
          - **笔记与知识库**：兼容旧文档正文中的重复标题，统一预览和编辑时的标题显示；优化阅读布局，滑回顶部时恢复导航栏。
          - **移动端文件仓库**：修复 Android 同步后目录显示，改进 Markdown 类型识别，并在文件列表标记同步旧副本。
          - **密钥箱与任务**：完善移动端账号标签、生物识别与恢复入口，以及任务日历、重复和倒计时设置。
          - **桌面体验**：修复文档预览和加载状态布局，减少 macOS 启动时的资源加载。

          ### 安装说明

          本次提供 Android APK、macOS Apple Silicon 与 Intel DMG、Windows x64 EXE。iOS IPA 尚未公开发布。macOS Intel 包已签名但未公证；Windows 包未签名，需手动下载安装，应用内自动更新仍保留原版本。

          上述功能概览依据已核对的 Android 与 macOS Apple Silicon 构建源码；Windows 和 macOS Intel 制品的源码提交尚未独立回证。所有 alpha 版本均处于测试阶段，升级前请备份重要数据。
          NOTES
          gh release edit v0.1.1-alpha.6-local --title v0.1.1-alpha.6 --notes-file /tmp/alpha6-notes.md
